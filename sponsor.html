<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devenir Sponsor — Landesert 4L Trophy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-cream: #FDF6E3;
      --color-sand: #E8C96D;
      --color-blue: #5BAFD6;
      --color-green: #3A7D44;
      --color-coral: #E85D3A;
      --color-brown: #6B4226;
      --color-bg: #FEFCF6;
      --color-text: #2D2A24;
      --color-subtle: #8A8070;
      --color-card: #FFFFFF;
      --color-border: rgba(107, 66, 38, 0.12);
      --font-heading: 'Quicksand', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 2rem;
      background: white;
      border-bottom: 1px solid var(--color-border);
    }
    .header a { text-decoration: none; color: var(--color-brown); }
    .header .logo { font-family: var(--font-heading); font-weight: 700; font-size: 1.3rem; }
    .header .back { font-size: 0.9rem; opacity: 0.7; }
    .header .back:hover { opacity: 1; }

    .main { display: flex; flex: 1; overflow: hidden; }

    /* ---- Viewer ---- */
    .viewer-panel { flex: 1; position: relative; background: #f0ebe0; overflow: hidden; }
    .viewer-panel canvas { width: 100%; height: 100%; display: block; }

    .viewer-hint {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(45, 42, 36, 0.75);
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    /* ---- Side panel ---- */
    .side-panel {
      width: 400px;
      background: white;
      border-left: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .side-panel h2 {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-cream);
    }

    .side-intro {
      padding: 1rem 1.2rem;
      font-size: 0.85rem;
      color: var(--color-subtle);
      border-bottom: 1px solid var(--color-border);
      line-height: 1.6;
    }

    .category-tabs {
      display: flex;
      border-bottom: 1px solid var(--color-border);
    }
    .category-tab {
      flex: 1;
      padding: 0.6rem 0.5rem;
      text-align: center;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      border: none;
      background: white;
      color: var(--color-subtle);
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .category-tab:hover { color: var(--color-text); }
    .category-tab.active {
      color: var(--color-coral);
      border-bottom-color: var(--color-coral);
    }

    .zones-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .zone-card {
      background: var(--color-cream);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-bottom: 0.5rem;
      border: 2px solid var(--color-border);
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .zone-card:hover {
      border-color: var(--color-sand);
      transform: translateY(-1px);
    }
    .zone-card.selected {
      border-color: var(--color-coral);
    }
    .zone-card.reserved {
      opacity: 0.5;
      cursor: default;
    }
    .zone-card.reserved:hover {
      transform: none;
      border-color: var(--color-border);
    }

    .zone-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }
    .zone-card-name {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--color-brown);
    }
    .zone-card-status {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-weight: 600;
    }
    .zone-card-status.available {
      background: #e2f0e5;
      color: var(--color-green);
    }
    .zone-card-status.reserved {
      background: #fde8e2;
      color: var(--color-coral);
    }
    .zone-card-cat {
      font-size: 0.75rem;
      color: var(--color-subtle);
    }

    /* ---- Contact section ---- */
    .contact-bar {
      padding: 1rem 1.2rem;
      border-top: 1px solid var(--color-border);
      text-align: center;
    }
    .contact-bar p {
      font-size: 0.8rem;
      color: var(--color-subtle);
      margin-bottom: 0.6rem;
    }
    .btn-contact {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      background: var(--color-green);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-contact:hover {
      background: #2e6335;
      transform: translateY(-1px);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-brown);
      color: white;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: var(--font-heading);
      transition: transform 0.3s ease;
      z-index: 100;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .viewer-panel { min-height: 50vh; }
      .side-panel { width: 100%; max-height: 50vh; }
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" class="back">&larr; Retour au site</a>
    <a href="index.html" class="logo">LANDESERT</a>
  </div>

  <div class="main">
    <div class="viewer-panel">
      <canvas id="car-viewer"></canvas>
      <div class="viewer-hint" id="viewer-hint">Cliquez sur une zone colorée pour la sélectionner</div>
    </div>
    <div class="side-panel">
      <h2>Emplacements Sponsors</h2>
      <div class="side-intro">
        Choisissez un emplacement pour votre logo sur notre 4L !
        Cliquez sur une zone sur la voiture ou dans la liste ci-dessous.
      </div>
      <div class="category-tabs" id="category-tabs">
        <!-- Generated by JS -->
      </div>
      <div class="zones-list" id="zones-list">
        <!-- Generated by JS -->
      </div>
      <div class="contact-bar">
        <p>Un emplacement vous intéresse ?</p>
        <a href="mailto:landesert.4ltrophy@gmail.com?subject=Sponsoring%204L%20Trophy%20—%20Réservation%20emplacement" class="btn-contact">Nous contacter</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const modelPath = "assets/models/4l.glb";
    const carColors = {
      peinture: "#a8c7c1", peinture1: "#a8c7c1", peinture2: "#a8c7c1", peinture3: "#a8c7c1",
      caouchou: "#222222", metal_noir: "#1a1a1a", metal_noir1: "#1a1a1a",
      chrome: "#cccccc", cuir: "#3b2a1a",
    };

    // ---- Zone data (loaded from file) ----
    let zonesData = [];

    // Category config
    const categories = {
      "1": { label: "Catégorie 1", color: 0xe85d3a },
    };

    const COLOR_DEFAULT = 0xe85d3a;
    const COLOR_SELECTED = 0xffaa00;

    // ---- Three.js setup ----
    const canvas = document.getElementById("car-viewer");
    const container = canvas.parentElement;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0ebe0);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(3, 2, 4);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 1.5;
    controls.maxDistance = 8;
    controls.maxPolarAngle = Math.PI / 2 + 0.2;
    controls.target.set(0, 0.5, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    let autoRotateTimeout;
    controls.addEventListener("start", () => {
      controls.autoRotate = false;
      clearTimeout(autoRotateTimeout);
    });
    controls.addEventListener("end", () => {
      autoRotateTimeout = setTimeout(() => { controls.autoRotate = true; }, 5000);
    });

    const dirLight = new THREE.DirectionalLight(0xffeedd, 3);
    dirLight.position.set(5, 8, 3);
    scene.add(dirLight);
    scene.add(new THREE.HemisphereLight(0x87ceeb, 0xe8c96d, 1.2));
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(6, 48),
      new THREE.MeshStandardMaterial({ color: 0xe0d8c8 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    scene.add(ground);

    // ---- State ----
    const carMeshes = [];
    const zones = []; // { data, markers, line, fill }
    let selectedZoneIndex = -1;
    let activeCategory = "all";

    // ---- Load model + zones ----
    const loadModel = new Promise((resolve) => {
      new GLTFLoader().load(modelPath, (gltf) => {
        const model = gltf.scene;

        model.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(model);
        const sz = box.getSize(new THREE.Vector3());
        const scale = 2.5 / Math.max(sz.x, sz.y, sz.z);
        model.scale.setScalar(scale);

        model.updateMatrixWorld(true);
        const box2 = new THREE.Box3().setFromObject(model);
        const center2 = box2.getCenter(new THREE.Vector3());
        model.position.x -= center2.x;
        model.position.z -= center2.z;
        model.position.y -= box2.min.y;

        model.traverse((child) => {
          if (child.isMesh) {
            child.geometry.computeVertexNormals();
            const applyColor = (mat) => {
              if (carColors[mat.name]) mat.color.set(carColors[mat.name]);
              mat.side = THREE.DoubleSide;
            };
            if (Array.isArray(child.material)) child.material.forEach(applyColor);
            else applyColor(child.material);
            carMeshes.push(child);
          }
        });
        scene.add(model);
        resolve();
      });
    });

    const loadZones = fetch("assets/zones.json").then(r => r.json()).then(data => {
      zonesData = data.map(z => ({ ...z, category: z.category || "1", reserved: z.reserved || false }));
    });

    Promise.all([loadModel, loadZones]).then(() => {
      buildZones();
      buildCategoryTabs();
      renderZoneList();

      setTimeout(() => {
        document.getElementById("viewer-hint").style.opacity = "0";
      }, 4000);
    });

    // ---- Polygon helpers ----
    function createPolygonMesh(points, material) {
      if (points.length < 3) return null;
      const vecs = points.map(p => new THREE.Vector3(p.x, p.y, p.z));
      const vertices = [];
      for (let i = 1; i < vecs.length - 1; i++) {
        vertices.push(vecs[0].x, vecs[0].y, vecs[0].z);
        vertices.push(vecs[i].x, vecs[i].y, vecs[i].z);
        vertices.push(vecs[i + 1].x, vecs[i + 1].y, vecs[i + 1].z);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.computeVertexNormals();
      return new THREE.Mesh(geo, material);
    }

    function makeLineMat(color) {
      return new THREE.LineBasicMaterial({ color });
    }

    function makeFillMat(color) {
      return new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.25,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
    }

    function makeMarkerMat(color) {
      return new THREE.MeshBasicMaterial({ color });
    }

    const markerGeo = new THREE.SphereGeometry(0.02, 8, 8);

    // ---- Build 3D zones (floating polygons) ----
    function buildZones() {
      zonesData.forEach((data) => {
        const cat = categories[data.category] || categories["1"];
        const color = cat.color;

        // Markers (hidden on sponsor page)
        const markers = [];

        // Outline
        const pts = data.points.map(p => new THREE.Vector3(p.x, p.y, p.z));
        pts.push(pts[0]);
        const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
        const line = new THREE.Line(lineGeo, makeLineMat(color));
        line.renderOrder = 2;
        scene.add(line);

        // Fill
        const fill = createPolygonMesh(data.points, makeFillMat(color));
        if (fill) { fill.renderOrder = 1; scene.add(fill); }

        zones.push({ data, markers, line, fill });
      });
    }

    // ---- Update zone colors ----
    function updateZoneHighlights() {
      zones.forEach((zone, i) => {
        const isSelected = i === selectedZoneIndex;
        const isFiltered = activeCategory !== "all" && zone.data.category !== activeCategory;
        const cat = categories[zone.data.category] || categories["1"];
        const colorHex = isSelected ? COLOR_SELECTED : cat.color;
        const visible = !isFiltered;

        // Markers — replace material
        zone.markers.forEach(m => {
          m.material.dispose();
          m.material = makeMarkerMat(colorHex);
          m.visible = visible;
        });

        // Line — replace material
        zone.line.material.dispose();
        zone.line.material = makeLineMat(colorHex);
        zone.line.visible = visible;

        // Fill — replace material
        if (zone.fill) {
          zone.fill.material.dispose();
          zone.fill.material = makeFillMat(colorHex);
          zone.fill.material.opacity = isSelected ? 0.45 : 0.25;
          zone.fill.visible = visible;
        }
      });
    }

    // ---- Category tabs ----
    function buildCategoryTabs() {
      const tabsEl = document.getElementById("category-tabs");
      const allTab = document.createElement("button");
      allTab.className = "category-tab active";
      allTab.textContent = "Tous";
      allTab.dataset.cat = "all";
      allTab.addEventListener("click", () => setCategory("all"));
      tabsEl.appendChild(allTab);

      Object.entries(categories).forEach(([key, cat]) => {
        const tab = document.createElement("button");
        tab.className = "category-tab";
        tab.textContent = cat.label;
        tab.dataset.cat = key;
        tab.addEventListener("click", () => setCategory(key));
        tabsEl.appendChild(tab);
      });
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll(".category-tab").forEach(t => {
        t.classList.toggle("active", t.dataset.cat === cat);
      });
      selectedZoneIndex = -1;
      updateZoneHighlights();
      renderZoneList();
    }

    // ---- Zone list ----
    function renderZoneList() {
      const listEl = document.getElementById("zones-list");
      listEl.innerHTML = "";

      zones.forEach((zone, i) => {
        if (activeCategory !== "all" && zone.data.category !== activeCategory) return;

        const card = document.createElement("div");
        card.className = "zone-card";
        if (i === selectedZoneIndex) card.classList.add("selected");
        if (zone.data.reserved) card.classList.add("reserved");

        const statusClass = zone.data.reserved ? "reserved" : "available";
        const statusText = zone.data.reserved ? "Réservé" : "Disponible";
        const catLabel = (categories[zone.data.category] || {}).label || zone.data.category;

        card.innerHTML = `
          <div class="zone-card-header">
            <span class="zone-card-name">${zone.data.name}</span>
            <span class="zone-card-status ${statusClass}">${statusText}</span>
          </div>
          <span class="zone-card-cat">${catLabel}</span>
        `;

        if (!zone.data.reserved) {
          card.addEventListener("click", () => selectZone(i));
        }

        listEl.appendChild(card);
      });
    }

    // ---- Selection ----
    function selectZone(index) {
      selectedZoneIndex = index;
      updateZoneHighlights();
      renderZoneList();

      // Animate camera to zone
      const zone = zones[index];
      const center = new THREE.Vector3();
      zone.data.points.forEach(p => center.add(new THREE.Vector3(p.x, p.y, p.z)));
      center.divideScalar(zone.data.points.length);

      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const camDir = camera.position.clone().sub(controls.target).normalize();
      const newCamPos = center.clone().add(camDir.multiplyScalar(2.5));

      controls.autoRotate = false;
      clearTimeout(autoRotateTimeout);

      const duration = 600, startTime = performance.now();
      function anim(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(startPos, newCamPos, ease);
        controls.target.lerpVectors(startTarget, center, ease);
        controls.update();
        if (t < 1) requestAnimationFrame(anim);
      }
      requestAnimationFrame(anim);

      // Update mailto link with zone name
      const contactBtn = document.querySelector(".btn-contact");
      const subject = encodeURIComponent(`Sponsoring 4L Trophy — ${zone.data.name}`);
      const body = encodeURIComponent(`Bonjour,\n\nJe suis intéressé(e) par l'emplacement "${zone.data.name}" (${(categories[zone.data.category] || {}).label || ""}) sur votre 4L.\n\nCordialement,`);
      contactBtn.href = `mailto:landesert.4ltrophy@gmail.com?subject=${subject}&body=${body}`;
    }

    // ---- Click on 3D zone ----
    let mouseDownPos = null;
    renderer.domElement.addEventListener("mousedown", (e) => {
      mouseDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener("mouseup", (e) => {
      const dx = e.clientX - mouseDownPos.x;
      const dy = e.clientY - mouseDownPos.y;
      if (Math.sqrt(dx * dx + dy * dy) > 5) return;

      const rect = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      const ray = new THREE.Raycaster();
      ray.setFromCamera(mouse, camera);

      // Check zone fills
      const fillMeshes = zones.map(z => z.fill).filter(Boolean);
      const intersects = ray.intersectObjects(fillMeshes, false);
      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        const zoneIndex = zones.findIndex(z => z.fill === hitMesh);
        if (zoneIndex >= 0 && !zones[zoneIndex].data.reserved) {
          selectZone(zoneIndex);
          return;
        }
      }

      // Deselect if clicking elsewhere
      selectedZoneIndex = -1;
      updateZoneHighlights();
      renderZoneList();
    });

    // ---- Resize ----
    new ResizeObserver(() => {
      const w = container.clientWidth, h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }).observe(container);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ---- Toast ----
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }
  </script>
</body>
</html>
